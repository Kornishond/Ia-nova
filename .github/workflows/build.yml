name: Build Echo Nova APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Echo Nova project
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq Echo-Nova-0.1.0-projet-complet.zip
          chmod +x Echo-Nova/gradlew Echo-Nova/scripts/*.sh

      - name: Fix Java compilation
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/b\.setTextAllCaps(false);/b.setAllCaps(false);/' Echo-Nova/app/src/main/java/fr/echo/nova/android/MainActivity.java
          grep -F 'b.setAllCaps(false);' Echo-Nova/app/src/main/java/fr/echo/nova/android/MainActivity.java

      - name: Test and compile APK
        working-directory: Echo-Nova
        run: ./scripts/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Nova-APK
          path: Echo-Nova/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
