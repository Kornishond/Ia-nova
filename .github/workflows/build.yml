name: Build Echo Nova Beta APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Echo Nova Beta
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq EchoNova020.zip
          chmod +x Echo-Nova/gradlew Echo-Nova/scripts/*.sh

      - name: Test and compile APK
        working-directory: Echo-Nova
        run: |
          ./scripts/test_core.sh
          python3 scripts/verify_project.py
          ./gradlew --no-daemon clean :app:assembleDebug

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Nova-0.2.0-beta-APK
          path: Echo-Nova/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
