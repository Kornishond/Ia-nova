
name: Build Echo Nova APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Echo Nova
        run: |
          unzip -q Echo-Nova-0.1.0-projet-complet.zip
          chmod +x Echo-Nova/gradlew Echo-Nova/scripts/*.sh

      - name: Compile APK
        working-directory: Echo-Nova
        run: ./scripts/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Nova-APK
          path: Echo-Nova/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
